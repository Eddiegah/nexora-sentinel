services:
  - type: web
    name: nexora-sentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Points at an external, non-expiring Postgres (e.g. Neon's free
      # tier) instead of Render's own free Postgres, which auto-deletes
      # 30 days after creation. Set this manually in the Render dashboard
      # (Environment tab) -- sync: false means Blueprint syncs never
      # overwrite it.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: ML_ARTIFACTS_DIR
        value: /app/ml/artifacts
      - key: PROCESSED_DATA_CSV
        value: /app/data/processed/malaria_africa.csv
